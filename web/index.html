<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111111">
<title>GYM</title>
<style>
  :root { color-scheme: dark; --bg:#111; --fg:#eee; --muted:#999; --ok:#4ade80; --bad:#f87171; --btn:#eee; --btn-fg:#111; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100dvh; display:grid; place-items:center; font-family:system-ui,-apple-system,sans-serif; background:var(--bg); color:var(--fg); padding:24px max(16px, env(safe-area-inset-right)) 24px max(16px, env(safe-area-inset-left)); text-align:center; }
  main { max-width:360px; width:100%; display:grid; gap:16px; }
  h1 { margin:0; font-size:40px; letter-spacing:-.02em; }
  p { margin:0; color:var(--muted); line-height:1.5; }
  button { font:inherit; font-weight:600; font-size:17px; padding:16px; border-radius:14px; border:0; background:var(--btn); color:var(--btn-fg); cursor:pointer; }
  button:disabled { opacity:.5; }
  .secondary { background:transparent; color:var(--muted); border:1px solid #333; }
  ul { list-style:none; padding:0; margin:0; text-align:left; display:grid; gap:8px; }
  li { padding:12px 14px; border-radius:12px; background:#1c1c1c; }
  .ok { color:var(--ok); } .bad { color:var(--bad); }
</style>
</head>
<body>
<main>
  <h1>GYM</h1>
  <p>En construcción. Prueba de conexión con Firebase.</p>
  <button id="login" disabled>Cargando…</button>
  <ul id="checks" hidden></ul>
  <button id="logout" class="secondary" hidden>Cerrar sesión</button>
</main>
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";
  import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js";
  import { getFirestore, doc, setDoc, getDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js";
  import { firebaseConfig } from "./firebase-config.js";

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);
  const $ = (id) => document.getElementById(id);
  const login = $("login"), logout = $("logout"), checks = $("checks");

  const item = (ok, text) => { const li = document.createElement("li"); li.className = ok ? "ok" : "bad"; li.textContent = (ok ? "✓ " : "✗ ") + text; checks.append(li); };

  login.onclick = async () => {
    login.disabled = true;
    try { await signInWithPopup(auth, new GoogleAuthProvider()); }
    catch (e) {
      checks.hidden = false; checks.replaceChildren();
      const msg = e.code === "auth/unauthorized-domain" ? "Falta añadir ikerp1.github.io en Authentication → Configuración → Dominios autorizados."
        : e.code === "auth/operation-not-allowed" ? "El inicio de sesión con Google no está activado en Authentication → Método de acceso."
        : e.code === "auth/popup-closed-by-user" ? "Has cerrado la ventana de Google antes de terminar."
        : "No se pudo iniciar sesión (" + e.code + ").";
      item(false, msg);
      login.disabled = false;
    }
  };
  logout.onclick = () => signOut(auth);

  onAuthStateChanged(auth, async (user) => {
    checks.replaceChildren();
    if (!user) { login.hidden = false; login.disabled = false; login.textContent = "Entrar con Google"; logout.hidden = true; checks.hidden = true; return; }
    login.hidden = true; logout.hidden = false; checks.hidden = false;
    item(true, "Sesión iniciada: " + (user.displayName || user.email));
    try {
      const ref = doc(db, "users", user.uid, "meta", "prueba");
      await setDoc(ref, { ultimaPrueba: serverTimestamp() });
      const snap = await getDoc(ref);
      item(snap.exists(), snap.exists() ? "Base de datos: guardar y leer funciona" : "Base de datos: no se pudo leer el dato");
    } catch (e) {
      item(false, e.code === "permission-denied" ? "Base de datos: las reglas no permiten guardar. Revisa el paso 4 (pestaña Reglas)." : "Base de datos: error (" + e.code + "). ¿Has creado Firestore (paso 4)?");
    }
  });
</script>
</body>
</html>
