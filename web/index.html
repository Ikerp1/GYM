<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e0f11">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="GYM">
<title>GYM</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600;700&display=swap">
<style>
/* Diseño: oscuro, pensado para el móvil en el gym. Botones grandes, números grandes.
   Tipos: Barlow Condensed (títulos y números) + Barlow (texto). Acento ámbar. */
:root {
  color-scheme: dark;
  --bg: #0e0f11;
  --surface: #17191c;
  --surface-2: #202328;
  --line: #2b2f35;
  --fg: #f2f3f5;
  --muted: #8e959e;
  --accent: #f5a524;
  --accent-fg: #1b1203;
  --accent-soft: rgba(245, 165, 36, .14);
  --ok: #3ecf8e;
  --ok-soft: rgba(62, 207, 142, .13);
  --danger: #f0605d;
  --hint: #5f666f;
  --friend: #5ab0f2;
  --friend-soft: rgba(90, 176, 242, .14);
  --fig: #e4e7eb;
  --fig-far: #69707a;
  --eq: #474d55;
  --font-display: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
  --font-body: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
  --radius: 16px;
  --tabbar-h: 64px;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--bg); color: var(--fg); }
body { font: 16px/1.45 var(--font-body); -webkit-font-smoothing: antialiased; min-height: 100dvh; }
body.no-scroll { overflow: hidden; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; }
button:disabled { opacity: .35; cursor: default; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }
h1, h2, h3 { margin: 0; font-family: var(--font-display); font-weight: 700; letter-spacing: .01em; line-height: 1.05; text-wrap: balance; }
h1 { font-size: 40px; text-transform: uppercase; }
h3 { font-size: 21px; }
p { margin: 0; }
.muted { color: var(--muted); }
.small { font-size: 14px; }
.center { text-align: center; }
.eyebrow { font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.error { color: var(--danger); text-align: center; }
.danger-text { color: var(--danger) !important; }

/* Estructura */
.app { min-height: 100dvh; }
.topbar { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; justify-content: space-between; padding: calc(10px + env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) 10px max(16px, env(safe-area-inset-left)); background: rgba(14, 15, 17, .92); backdrop-filter: blur(10px); }
.brand { font: 700 22px var(--font-display); letter-spacing: .12em; color: var(--accent); }
.avatar { width: 36px; height: 36px; border-radius: 50%; overflow: hidden; background: var(--surface-2); display: grid; place-items: center; font-weight: 700; }
.avatar img { width: 100%; height: 100%; object-fit: cover; }
.content { max-width: 640px; margin: 0 auto; padding: 4px max(16px, env(safe-area-inset-right)) calc(var(--tabbar-h) + 110px + env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); }
.view { display: grid; gap: 14px; }
.view-head { display: grid; gap: 4px; padding: 6px 0 4px; }
.view-head.row { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }
.daily-quote { border-left: 3px solid var(--accent); padding: 2px 0 2px 10px; margin: 4px 0 6px; max-width: 36ch; display: grid; gap: 3px; }
.daily-quote blockquote { margin: 0; font-size: 15px; line-height: 1.45; font-style: italic; color: var(--fg); opacity: .88; text-wrap: pretty; }
.daily-quote figcaption { font-size: 12px; color: var(--muted); letter-spacing: .02em; }
.section-title { font-size: 24px; text-transform: uppercase; margin-top: 10px; }

/* Barra inferior */
.tabbar { position: fixed; z-index: 10; left: 0; right: 0; bottom: 0; display: flex; justify-content: space-around; padding: 6px max(8px, env(safe-area-inset-right)) calc(6px + env(safe-area-inset-bottom)) max(8px, env(safe-area-inset-left)); background: rgba(23, 25, 28, .96); backdrop-filter: blur(10px); border-top: 1px solid var(--line); }
.tabbar button { position: relative; flex: 1; max-width: 140px; min-height: 52px; display: grid; justify-items: center; align-content: center; gap: 3px; color: var(--muted); font-size: 12px; font-weight: 600; border-radius: 12px; }
.tabbar button.on { color: var(--accent); }
.tab-icon { display: grid; place-items: center; height: 26px; transition: opacity .15s; }
.tabbar button.on .tab-icon { opacity: 0; } /* el bíceps ocupa su lugar */
.tab-fly { position: absolute; left: 0; top: 0; width: 34px; height: 34px; margin: -17px 0 0 -17px; pointer-events: none; z-index: 1; will-change: transform; }
.bicep { width: 34px; height: 34px; display: block; overflow: visible; filter: drop-shadow(0 3px 6px rgba(245, 165, 36, .35)); }
.bicep-arm { fill: none; stroke: var(--accent); stroke-width: 6.4; stroke-linecap: round; stroke-linejoin: round; }
.bicep-fill { fill: var(--accent); stroke: none; }
.bicep-line { fill: none; stroke: #17191c; stroke-width: 1.1; stroke-linecap: round; }
.live-dot { position: absolute; top: 8px; right: calc(50% - 18px); width: 9px; height: 9px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 0 3px rgba(23, 25, 28, 1); animation: pulse 1.6s infinite; }

/* Botones */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 0 18px; border-radius: 14px; font-weight: 700; font-size: 16px; background: var(--surface-2); color: var(--fg); transition: transform .12s, filter .12s; }
.btn:active:not(:disabled) { transform: scale(.98); }
.btn.primary { background: var(--accent); color: var(--accent-fg); }
.btn.danger { background: var(--danger); color: #fff; }
.btn.ghost { background: transparent; border: 1px solid var(--line); }
.btn.link { background: none; min-height: 40px; font-weight: 600; color: var(--muted); }
.btn.big { min-height: 58px; font-size: 19px; font-family: var(--font-display); text-transform: uppercase; letter-spacing: .04em; }
.btn.sm { min-height: 40px; padding: 0 12px; font-size: 14px; }
.btn.block { width: 100%; }
.btn svg { width: 18px; height: 18px; }
.icon-btn { width: 40px; height: 40px; display: grid; place-items: center; border-radius: 10px; color: var(--muted); }
.icon-btn:active:not(:disabled) { background: var(--surface-2); }
.icon-btn svg { width: 19px; height: 19px; }

/* Tarjetas */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; display: grid; gap: 8px; }
.pill { display: inline-flex; align-items: center; padding: 4px 10px; border-radius: 99px; background: var(--surface-2); font-size: 13px; font-weight: 600; color: var(--muted); white-space: nowrap; font-family: var(--font-body); text-transform: none; letter-spacing: 0; vertical-align: middle; }
.pill.accent { background: var(--accent-soft); color: var(--accent); }
.empty { border: 1px dashed var(--line); border-radius: var(--radius); padding: 28px 18px; text-align: center; color: var(--muted); }
.empty.small { padding: 18px 14px; font-size: 14px; }

/* Hoy */
.hero { background: linear-gradient(160deg, #22201a, var(--surface) 60%); border: 1px solid #3a3222; border-radius: 20px; padding: 18px; display: grid; gap: 14px; }
.hero-top { display: grid; gap: 4px; }
.hero-title { font-size: 46px; text-transform: uppercase; color: var(--accent); }
/* Tarjeta compacta de la rutina de hoy */
.hero.compact { gap: 10px; padding: 16px; }
.hero.compact .hero-title { font-size: 38px; }
.mini-row { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
.mini-thumb { flex-shrink: 0; border-radius: 10px; }
.mini-thumb .thumb { width: 44px; height: 44px; }
.plan-toggle { justify-self: start; min-height: 32px; padding: 0; font-size: 14px; color: var(--muted); gap: 4px; }
.plan-toggle .chev { display: grid; transition: transform .2s; }
.plan-toggle .chev svg { width: 16px; height: 16px; }
.plan-toggle .chev.up { transform: rotate(180deg); }
.plan { list-style: none; margin: 0; padding: 0; display: grid; }
.plan li { border-top: 1px solid var(--line); }
.plan-row { width: 100%; display: flex; align-items: center; gap: 12px; padding: 8px 0; text-align: left; }
.plan-name { font-weight: 600; flex: 1; min-width: 0; }
.plan-meta { color: var(--muted); font-size: 15px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.plan-meta b { color: var(--fg); }
.other-routines { display: grid; gap: 8px; }

/* Chips */
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chips.scroll-x { flex-wrap: nowrap; overflow-x: auto; padding-bottom: 4px; margin: 0 -2px; scrollbar-width: none; min-height: 44px; flex-shrink: 0; }
.chips.scroll-x .chip { flex-shrink: 0; }
.chip { min-height: 40px; padding: 0 14px; border-radius: 99px; background: var(--surface-2); color: var(--muted); font-weight: 600; font-size: 14px; white-space: nowrap; }
.chip.on { background: var(--accent); color: var(--accent-fg); }

/* Entreno */
.ex-card { gap: 10px; }
.ex-head { display: flex; gap: 10px; align-items: flex-start; }
.ex-title { flex: 1; min-width: 0; display: grid; gap: 3px; }
.thumb-btn { flex-shrink: 0; border-radius: 12px; }
/* Asa para arrastrar ejercicios durante el entreno */
.drag-handle { flex-shrink: 0; width: 28px; height: 48px; margin-left: -6px; display: grid; place-items: center; border-radius: 8px; color: var(--muted); touch-action: none; cursor: grab; user-select: none; -webkit-user-select: none; }
.drag-handle svg { width: 20px; height: 20px; fill: currentColor; stroke: none; }
.drag-handle:active { cursor: grabbing; color: var(--accent); background: var(--surface-2); }
.ex-card.drag-active, .edit-item.drag-active { transition: transform .18s ease; }
.ex-card.dragging, .edit-item.dragging { transition: none; box-shadow: 0 18px 40px rgba(0, 0, 0, .55); outline: 1px solid var(--accent); }
.ex-card.drag-active:not(.dragging), .edit-item.drag-active:not(.dragging) { opacity: .85; }
.ex-tools { display: flex; gap: 2px; flex-shrink: 0; }
.ex-tools.vertical { flex-direction: column; }
.sets { display: grid; gap: 6px; }
.set-row { display: grid; grid-template-columns: 30px minmax(0, 1fr) minmax(0, 1fr) 46px; gap: 8px; align-items: center; }
.set-row.head { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); text-align: center; }
.set-n { height: 40px; border-radius: 10px; font: 700 18px var(--font-display); color: var(--muted); }
.num { width: 100%; min-width: 0; height: 40px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface-2); text-align: center; font: 700 19px var(--font-display); font-variant-numeric: tabular-nums; }
.num:focus { border-color: var(--accent); outline: none; }
/* Números en gris = lo de la última vez (pista). Lo que escribes hoy sale en blanco. */
.num::placeholder { color: var(--hint); opacity: 1; font-weight: 600; }
.check { height: 40px; border-radius: 10px; border: 2px solid var(--line); display: grid; place-items: center; color: transparent; }
.check svg { width: 22px; height: 22px; stroke-width: 3; }
.check.on { background: var(--ok); border-color: var(--ok); color: #06210f; }
.set-row.is-done .num { background: var(--ok-soft); border-color: transparent; }
/* Notas de ejercicio */
.prev-note { display: flex; gap: 10px; align-items: flex-start; background: var(--accent-soft); border-left: 3px solid var(--accent); border-radius: 10px; padding: 8px 10px; }
.prev-note-icon { color: var(--accent); display: grid; padding-top: 2px; }
.prev-note-icon svg { width: 18px; height: 18px; }
.prev-note small { display: block; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--accent); }
.prev-note p { margin: 2px 0 0; font-size: 15px; line-height: 1.35; }
.note-input { min-height: 0; padding: 10px 12px; resize: vertical; font: 15px/1.4 var(--font-body); }
.note-line, .note-inline { display: flex; gap: 6px; align-items: flex-start; margin: 0; font-size: 13px; color: var(--muted); font-style: italic; }
.note-inline { display: inline-flex; }
.note-line svg, .note-inline svg { width: 14px; height: 14px; flex-shrink: 0; margin-top: 2px; }
.ex-foot .btn svg { width: 16px; height: 16px; }
.ex-foot { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.rest-select { margin-left: auto; display: flex; align-items: center; gap: 4px; color: var(--muted); }
.rest-select svg { width: 18px; height: 18px; }
.rest-select select { background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; height: 40px; padding: 0 8px; }

/* Descanso */
.restbar { position: fixed; z-index: 9; left: max(10px, env(safe-area-inset-left)); right: max(10px, env(safe-area-inset-right)); bottom: calc(var(--tabbar-h) + 10px + env(safe-area-inset-bottom)); max-width: 620px; margin: 0 auto; background: var(--surface-2); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; box-shadow: 0 12px 30px rgba(0, 0, 0, .5); }
.rest-progress { position: absolute; inset: 0 auto 0 0; background: var(--accent-soft); transition: width .25s linear; }
.rest-row { position: relative; display: flex; align-items: center; gap: 8px; padding: 8px 8px 8px 14px; }
.rest-icon { color: var(--accent); display: grid; }
.rest-time { flex: 1; font: 700 30px var(--font-display); font-variant-numeric: tabular-nums; }
.rest-btn { min-width: 52px; height: 44px; padding: 0 10px; border-radius: 10px; background: var(--surface); font-weight: 700; }
.restbar.done { border-color: var(--ok); }
.restbar.done .rest-time { color: var(--ok); font-size: 24px; }

/* Ventanas (sheets) */
.sheet-backdrop { position: fixed; inset: 0; z-index: 20; background: rgba(0, 0, 0, .6); display: flex; align-items: flex-end; justify-content: center; animation: fade .15s ease; }
.sheet { width: 100%; max-width: 640px; max-height: 92dvh; display: flex; flex-direction: column; background: var(--surface); border-radius: 22px 22px 0 0; border: 1px solid var(--line); border-bottom: 0; animation: up .2s ease; }
.sheet-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 16px 12px 8px 18px; }
.sheet-head h2 { font-size: 26px; text-transform: uppercase; }
.sheet-body { overflow-y: auto; padding: 4px 18px 18px; display: grid; gap: 14px; align-content: start; }
.sheet-foot { display: flex; gap: 10px; justify-content: flex-end; padding: 12px 18px calc(12px + env(safe-area-inset-bottom)); border-top: 1px solid var(--line); }
.sheet-foot .btn { flex: 1; }
@media (min-width: 700px) { .sheet-backdrop { align-items: center; } .sheet { border-radius: 22px; border-bottom: 1px solid var(--line); } }

/* Formularios */
.field { display: grid; gap: 6px; }
.field > span { font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.input { width: 100%; min-height: 48px; padding: 0 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface-2); font-size: 16px; }
.input:focus { border-color: var(--accent); outline: none; }
.search { position: relative; }
.search .input { padding-left: 42px; }
.search-icon { position: absolute; left: 12px; top: 13px; color: var(--muted); display: grid; }
.pick-list { list-style: none; margin: 0; padding: 0; display: grid; }
.pick-list button { width: 100%; min-height: 60px; display: flex; align-items: center; gap: 12px; padding: 6px 4px; border-bottom: 1px solid var(--line); text-align: left; font-weight: 600; }
.pick-name { flex: 1; min-width: 0; }
.pick-list small { color: var(--muted); font-weight: 500; white-space: nowrap; }
.stepper { display: inline-flex; align-items: center; background: var(--surface-2); border: 1px solid var(--line); border-radius: 12px; height: 46px; }
.stepper button { width: 42px; height: 100%; font-size: 22px; font-weight: 700; color: var(--accent); }
.stepper span { color: var(--fg); min-width: 30px; text-align: center; font: 700 22px var(--font-display); font-variant-numeric: tabular-nums; }

/* Rutinas */
.routine-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.routine-card { display: flex; align-items: center; gap: 4px; padding: 8px 6px 8px 8px; }
.routine-main { flex: 1; min-width: 0; display: flex; align-items: center; gap: 12px; text-align: left; padding: 6px; border-radius: 12px; }
.routine-n { width: 40px; height: 40px; border-radius: 12px; background: var(--surface-2); display: grid; place-items: center; font: 700 22px var(--font-display); color: var(--accent); flex-shrink: 0; }
.routine-info { flex: 1; min-width: 0; display: grid; gap: 2px; }
.routine-info b { font: 700 22px var(--font-display); text-transform: uppercase; }
.routine-info small { color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 14px; }
.routine-edit { color: var(--muted); display: grid; }
.edit-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.edit-item { background: var(--surface-2); border-radius: 14px; padding: 10px 10px 12px 14px; display: grid; gap: 10px; }
.edit-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.edit-top b { min-width: 0; flex: 1; }

/* Siluetas de ejercicios */
.thumb { width: 48px; height: 48px; flex-shrink: 0; border-radius: 10px; background: var(--bg); }
.fig-none { display: grid; place-items: center; color: var(--line); }
.fig-none svg { width: 26px; height: 26px; }
.fig-stage { background: radial-gradient(circle at 50% 40%, #1d2025, var(--bg) 75%); border: 1px solid var(--line); border-radius: 18px; padding: 8px; }
.fig-big { display: block; width: 100%; max-width: 420px; height: auto; margin: 0 auto; }
svg.fig, svg.fig-big { stroke: none; fill: none; }
.fig .limb, .fig-big .limb { fill: none; stroke: var(--fig); stroke-linecap: round; stroke-linejoin: round; }
.fig .limb.far, .fig-big .limb.far { stroke: var(--fig-far); }
.fig .head, .fig .joint, .fig-big .head, .fig-big .joint { fill: var(--fig); }
.fig .joint.far, .fig-big .joint.far { fill: var(--fig-far); }
.fig .eq, .fig-big .eq { stroke: var(--eq); stroke-linecap: round; fill: none; }
.fig .eq-fill, .fig-big .eq-fill { fill: var(--eq); }
.fig .load, .fig-big .load { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 3; }
.fig .cable, .fig-big .cable { stroke: var(--muted); stroke-dasharray: 3 3; }
.fig .floor, .fig-big .floor { stroke: var(--line); }
.edit-controls { display: flex; flex-wrap: wrap; gap: 10px 14px; }
.edit-controls label { display: grid; gap: 4px; font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.edit-controls .stepper { background: var(--surface); }
.edit-controls select.input { min-height: 46px; width: auto; background: var(--surface); }
.edit-controls .kg-input { color: var(--fg); width: 92px; min-height: 46px; padding: 0 8px; text-align: center; font: 700 22px var(--font-display); background: var(--surface); }

/* Progreso */
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stats > div { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px; display: grid; gap: 2px; }
.stats b { font: 700 32px var(--font-display); font-variant-numeric: tabular-nums; line-height: 1; }
.stats span { color: var(--muted); font-size: 13px; }
.sheet .stats > div { background: var(--surface-2); }
.seg { display: flex; background: var(--surface-2); border-radius: 12px; padding: 4px; gap: 4px; }
.seg button { flex: 1; min-height: 40px; border-radius: 9px; font-weight: 600; font-size: 14px; color: var(--muted); }
.seg button.on { background: var(--surface); color: var(--fg); }
.chart { width: 100%; height: auto; display: block; margin-top: 6px; stroke: none; }
.chart text { stroke: none; }
.chart .grid { stroke: var(--line); stroke-dasharray: 3 4; }
.chart .tick { fill: var(--muted); font-size: 10px; font-family: var(--font-body); }
.chart .line { fill: none; stroke: var(--accent); stroke-width: 2.5; stroke-linejoin: round; stroke-linecap: round; }
.chart .area { fill: var(--accent-soft); stroke: none; }
.chart .dot { fill: var(--surface); stroke: var(--accent); stroke-width: 2; }
.chart .dot.last { fill: var(--accent); }
.pr-title { display: flex; align-items: center; gap: 8px; font-size: 22px; text-transform: uppercase; margin-top: 8px; color: var(--accent); }
.pr-list { list-style: none; margin: 0; padding: 0; display: grid; }
.pr-list li { display: grid; grid-template-columns: 1fr auto; gap: 0 10px; padding: 10px 0; border-top: 1px solid var(--line); }
.pr-list b { font: 700 20px var(--font-display); font-variant-numeric: tabular-nums; text-align: right; }
.pr-list small { grid-column: 2; text-align: right; color: var(--muted); font-size: 12px; }
.history { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.hist-card { padding: 0; gap: 0; }
.hist-main { width: 100%; display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 14px 16px; text-align: left; }
.hist-main span:first-child { display: grid; gap: 2px; min-width: 0; }
.hist-main small { color: var(--muted); font-size: 14px; }
.hist-detail { padding: 0 16px 10px; display: grid; gap: 10px; border-top: 1px solid var(--line); padding-top: 12px; }

/* Selector bajo los números de Progress: calendario · tiempo · kilos */
.panel-wrap { display: grid; gap: 10px; }
.panel-switch { display: flex; gap: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 4px; }
.panel-switch button { flex: 1; min-height: 44px; display: grid; place-items: center; border-radius: 10px; color: var(--muted); transition: background .15s, color .15s; }
.panel-switch button.on { background: var(--accent); color: var(--accent-fg); }
.panel-switch svg { width: 22px; height: 22px; }
.panel { gap: 10px; }
.panel-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.panel-stats > div { background: var(--surface-2); border-radius: 10px; padding: 8px 10px; display: grid; gap: 1px; }
.panel-stats b { font: 700 20px var(--font-display); font-variant-numeric: tabular-nums; white-space: nowrap; }
.panel-stats span { color: var(--muted); font-size: 12px; }
.chart .bar { fill: rgba(245, 165, 36, .45); }
.chart .bar.last { fill: var(--accent); }
.chart .bar-val { fill: var(--fg); font: 600 10px var(--font-body); }

/* Botones que abren secciones de Progress */
.nav-list { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
.nav-btn { display: inline-flex; align-items: center; gap: 7px; min-height: 40px; padding: 0 14px 0 11px; border-radius: 99px; background: var(--surface); border: 1px solid var(--line); color: var(--fg); font-weight: 600; font-size: 14px; }
.nav-btn svg { width: 18px; height: 18px; color: var(--accent); }
.nav-btn:active { transform: scale(.97); background: var(--surface-2); }
.sheet-section { display: grid; gap: 10px; }

/* Por ejercicio: lista y estadísticas de un ejercicio */
.ex-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.ex-row { width: 100%; display: flex; align-items: center; gap: 12px; padding: 8px 10px; border-radius: 14px; background: var(--surface-2); text-align: left; }
.ex-row:active { transform: scale(.99); }
.ex-row-text { flex: 1; min-width: 0; display: grid; gap: 2px; }
.ex-row-text b { font-weight: 700; }
.ex-row-text small { color: var(--muted); font-size: 13px; }
.ex-row-kg { font: 700 20px var(--font-display); font-variant-numeric: tabular-nums; white-space: nowrap; }
.ex-row-kg small { font: 500 12px var(--font-body); color: var(--muted); }
.exstats { display: grid; gap: 12px; }
.exstats-head { display: grid; gap: 6px; justify-items: center; text-align: center; }
.fig-stage.small { width: 100%; max-width: 200px; padding: 2px; }
.tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
.tiles.three { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.tiles > div { background: var(--surface-2); border-radius: 12px; padding: 10px 12px; display: grid; gap: 2px; min-width: 0; }
.tiles span { color: var(--muted); font-size: 12px; }
.tiles b { font: 700 24px var(--font-display); font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tiles b small { font: 500 13px var(--font-body); color: var(--muted); }
.tiles b.tile-text { font-size: 20px; display: block; }
.tiles b.tile-text::first-letter { text-transform: uppercase; }
.tiles > div:last-child:nth-child(odd) { grid-column: 1 / -1; }
.gain { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; align-items: center; background: var(--surface-2); border-radius: 12px; padding: 10px 12px; }
.gain span { color: var(--muted); font-size: 12px; grid-column: 1 / -1; }
.gain b { font: 700 20px var(--font-display); font-variant-numeric: tabular-nums; }
.gain em { font: 700 18px var(--font-display); font-style: normal; color: var(--muted); }
.gain.up { box-shadow: inset 3px 0 0 var(--ok); }
.gain.up em { color: var(--ok); }
.gain.down { box-shadow: inset 3px 0 0 var(--danger); }
.gain.down em { color: var(--danger); }
.pr-title.plain { color: var(--fg); font-size: 20px; margin-top: 4px; }
.session-li { flex-direction: column; gap: 6px !important; }
.session-date { display: block; font-size: 13px; font-weight: 600; color: var(--muted); }
.session-date::first-letter { text-transform: uppercase; }

/* Body: peso y medidas */
.body { display: grid; gap: 12px; }
.tiles > .tile-btn { background: var(--surface-2); border-radius: 12px; padding: 10px 12px; display: grid; gap: 2px; min-width: 0; text-align: left; border: 1px dashed transparent; }
.tiles > .tile-btn:hover { border-color: var(--line); }
.tiles small.delta { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.body-form { gap: 12px; }
.body-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.body-field { display: grid; gap: 5px; font-size: 13px; font-weight: 600; color: var(--muted); min-width: 0; }
.body-field i { font-style: normal; font-weight: 400; opacity: .7; }
.unit-input { position: relative; }
.unit-input .input { padding-right: 38px; font: 700 20px var(--font-display); color: var(--fg); }
.unit-input em { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); font-style: normal; font-size: 13px; color: var(--muted); }
.row-btns { display: flex; gap: 8px; justify-content: flex-end; }
.row-btns .btn { flex: 1; }
.body-row-head { display: flex; align-items: center; justify-content: space-between; width: 100%; }

/* Calendario de días entrenados (Progress) */
.cal { gap: 8px; padding: 12px 14px 14px; }
.cal-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.cal-title { display: grid; justify-items: center; gap: 1px; text-align: center; }
.cal-title b { font: 700 20px var(--font-display); text-transform: uppercase; letter-spacing: .04em; }
.cal-title small { color: var(--muted); font-size: 13px; }
.icon-btn.flip svg { transform: rotate(180deg); }
.cal-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 3px; max-width: 320px; width: 100%; margin: 0 auto; }
.cal-wd { text-align: center; font-size: 11px; font-weight: 600; color: var(--muted); padding-bottom: 2px; }
.cal-day { position: relative; aspect-ratio: 1.25; display: grid; place-items: center; border-radius: 9px; font-variant-numeric: tabular-nums; }
.cal-n { font-size: 13px; font-weight: 600; color: var(--muted); }
.cal-day.done { background: var(--accent-soft); }
.cal-day.today { box-shadow: inset 0 0 0 1.5px var(--fg); }
.cal-day.today .cal-n { color: var(--fg); }
.cal-day.future .cal-n { opacity: .35; }
.cal-bicep { width: 80%; height: 80%; filter: none; }
button.cal-day { width: 100%; }
button.cal-day:not(:disabled):active { transform: scale(.94); }
button.cal-day.done:hover { background: rgba(245, 165, 36, .22); }
.day-workout { display: grid; gap: 10px; }
.day-workout + .day-workout { border-top: 1px solid var(--line); padding-top: 14px; }
.day-head { display: grid; gap: 3px; }
.day-head h3 { font-size: 24px; text-transform: uppercase; color: var(--accent); }
.day-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.day-list li { display: flex; gap: 12px; align-items: flex-start; background: var(--surface-2); border-radius: 12px; padding: 8px 10px; }
.day-ex { min-width: 0; display: grid; gap: 6px; }
.day-sets { display: flex; flex-wrap: wrap; gap: 6px; }
.day-set { background: var(--surface); border-radius: 8px; padding: 3px 8px; font: 700 16px var(--font-display); font-variant-numeric: tabular-nums; }
.day-set small { font: 500 11px var(--font-body); color: var(--muted); }
.cal-dn { position: absolute; top: 1px; left: 4px; font-size: 9px; font-weight: 700; color: var(--accent); opacity: .8; }

/* Rangos por grupo muscular */
.ranks { display: grid; gap: 12px; }
.rank-badge { stroke: none; flex-shrink: 0; display: block; filter: drop-shadow(0 2px 4px rgba(0, 0, 0, .4)); }
.rank-badge text { font-family: var(--font-body); stroke: none; }
.rank-hero { display: flex; align-items: center; gap: 14px; background: var(--surface-2); border-radius: 16px; padding: 14px; }
.rank-hero h3 { font-size: 34px; text-transform: uppercase; }
.rank-hero small { font-size: 12px; }
.rank-scale { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.rank-scale span { height: 6px; border-radius: 3px; }
.group-ranks { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.group-rank { display: flex; align-items: center; gap: 12px; background: var(--surface-2); border-radius: 12px; padding: 8px 10px; }
.group-rank.no-data { opacity: .55; }
.gr-text { flex: 1; min-width: 0; display: grid; gap: 4px; }
.gr-top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.gr-top b { font: 700 18px var(--font-display); text-transform: uppercase; }
.gr-top span { font: 700 16px var(--font-display); text-transform: uppercase; letter-spacing: .04em; }
.gr-bar { height: 6px; border-radius: 3px; background: var(--surface); overflow: hidden; }
.gr-bar i { display: block; height: 100%; border-radius: 3px; }
.gr-text small { font-size: 12px; color: var(--muted); line-height: 1.35; }
.rank-up { display: flex; align-items: center; gap: 12px; background: var(--surface-2); border: 1px solid var(--rc); border-radius: 14px; padding: 10px 12px; animation: up .4s ease; }
.rank-up small { display: block; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--rc); }
.rank-up b { font: 700 22px var(--font-display); text-transform: uppercase; }
.rank-up b span { color: var(--rc); }

/* Clasificación semanal */
.ranking { gap: 10px; }
.rank-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.rank-head small { font-size: 12px; }
.seg.mini { padding: 3px; }
.seg.mini button { min-height: 34px; padding: 0 12px; font-size: 13px; }
.rank-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.rank-row { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 12px; background: var(--surface-2); }
.rank-row.me { box-shadow: inset 0 0 0 1.5px var(--accent); }
.rank-pos { width: 28px; text-align: center; font: 700 20px var(--font-display); color: var(--muted); }
.rank-row.top1 .rank-pos { font-size: 20px; }
.rank-row.top2 .rank-pos { color: #c9ced6; }
.rank-row.top3 .rank-pos { color: #d29a6a; }
.rank-row .avatar { width: 34px; height: 34px; flex-shrink: 0; }
.rank-name { flex: 1; min-width: 0; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rank-val { font: 700 20px var(--font-display); font-variant-numeric: tabular-nums; white-space: nowrap; }
.rank-row.top1 .rank-val { color: var(--accent); }

/* Amigos */
.warn { background: rgba(240, 96, 93, .12); border: 1px solid rgba(240, 96, 93, .4); color: #ffb3b1; border-radius: 14px; padding: 12px 14px; font-size: 14px; }
.code-card { gap: 12px; }
.code-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.code { font: 700 44px var(--font-display); letter-spacing: .18em; color: var(--accent); font-variant-numeric: tabular-nums; }
.add-row { display: flex; gap: 8px; }
.code-input { flex: 1; min-width: 0; text-transform: uppercase; letter-spacing: .2em; font: 700 22px var(--font-display); text-align: center; }
.code-input::placeholder { letter-spacing: .1em; color: var(--hint); }
.friend-row { justify-content: flex-start; }
.friend-info { flex: 1; min-width: 0; display: grid; gap: 2px; }
.friend-info small { color: var(--muted); font-size: 14px; }
.avatar.big { width: 64px; height: 64px; font-size: 26px; border: 3px solid var(--accent); }
.avatar.friend { border-color: var(--friend); }
.back-link { justify-self: start; padding: 0; gap: 4px; }
.vs-head { display: flex; align-items: center; justify-content: center; gap: 22px; padding: 6px 0 4px; }
.vs-side { display: grid; justify-items: center; gap: 6px; }
.vs-side b { font: 700 20px var(--font-display); text-transform: uppercase; }
.vs { font: 700 30px var(--font-display); color: var(--muted); }
.vs-row { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 10px; padding: 8px 0; border-top: 1px solid var(--line); }
.vs-row span { color: var(--muted); font-size: 14px; text-align: center; }
.vs-row b { font: 700 28px var(--font-display); font-variant-numeric: tabular-nums; }
.vs-row b:last-child { text-align: right; }
.win { color: var(--accent); }
.friend-text { color: var(--fg); }
.friend-text.win { color: var(--friend); }
.vs-ex { justify-content: flex-start; gap: 12px; }
.vs-ex-name { flex: 1; min-width: 0; display: grid; gap: 2px; }
.vs-ex-name small { color: var(--muted); font-size: 13px; }
.vs-ex-vals { display: grid; justify-items: end; gap: 2px; font-variant-numeric: tabular-nums; }
.vs-ex-vals b { font: 700 19px var(--font-display); }
.legend { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; font-size: 13px; color: var(--muted); }
.key { width: 14px; height: 4px; border-radius: 2px; display: inline-block; }
.key.me { background: var(--accent); }
.key.friend { background: var(--friend); margin-left: 8px; }
.chart .line.friend { stroke: var(--friend); }
.chart .dot.friend { stroke: var(--friend); }

/* Inicio de sesión */
.login { min-height: 100dvh; display: grid; place-content: center; justify-items: center; gap: 16px; text-align: center; padding: 24px max(20px, env(safe-area-inset-right)) 24px max(20px, env(safe-area-inset-left)); max-width: 420px; margin: 0 auto; }
.login h1 { font-size: 64px; letter-spacing: .12em; color: var(--accent); }
.logo { width: 76px; height: 76px; border-radius: 22px; background: var(--accent); color: var(--accent-fg); display: grid; place-items: center; }
.logo svg { width: 42px; height: 42px; stroke-width: 2.4; }
.logo.pulse { animation: pulse 1.4s infinite; }

.toast { position: fixed; z-index: 30; left: 50%; transform: translateX(-50%); bottom: calc(var(--tabbar-h) + 20px + env(safe-area-inset-bottom)); background: var(--fg); color: var(--bg); padding: 12px 18px; border-radius: 12px; font-weight: 600; box-shadow: 0 10px 30px rgba(0, 0, 0, .5); max-width: calc(100% - 32px); }

@keyframes fade { from { opacity: 0; } }
@keyframes up { from { transform: translateY(30px); opacity: .5; } }
@keyframes pulse { 50% { opacity: .45; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
